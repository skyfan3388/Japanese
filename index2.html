<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>日文生活常用短句學習</title>
  <style>
    * {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC",
    "Noto Sans JP", Arial, sans-serif;
  background:
    radial-gradient(circle at 80% 8%, rgba(255, 196, 87, 0.35), transparent 16%),
    linear-gradient(180deg, #e0f2fe 0%, #f8fbff 42%, #fff1f2 100%);
  color: #1e3a5f;
  line-height: 1.6;
}

header {
  position: relative;
  overflow: hidden;
  background: linear-gradient(135deg, #1e3a8a, #2563eb 45%, #93c5fd);
  color: white;
  padding: 42px 20px 58px;
  text-align: center;
  box-shadow: 0 12px 28px rgba(30, 58, 138, 0.25);
}

/* 富士山輪廓 */
header::before {
  content: "";
  position: absolute;
  left: 50%;
  bottom: -42px;
  transform: translateX(-50%);
  width: 360px;
  height: 170px;
  background: linear-gradient(180deg, #f8fafc 0 23%, #475569 24% 100%);
  clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
  opacity: 0.95;
  z-index: 0;
}

/* 雪頂陰影 */
header::after {
  content: "";
  position: absolute;
  left: calc(50% - 44px);
  bottom: 60px;
  width: 88px;
  height: 48px;
  background: #ffffff;
  clip-path: polygon(
    50% 0%,
    30% 48%,
    42% 40%,
    50% 70%,
    61% 38%,
    72% 52%
  );
  opacity: 0.98;
  z-index: 1;
}

header h1,
header p {
  position: relative;
  z-index: 2;
  text-shadow: 0 2px 8px rgba(15, 23, 42, 0.25);
}

header h1 {
  margin: 0;
  font-size: 2rem;
  letter-spacing: 1px;
}

header p {
  margin: 10px 0 0;
  opacity: 0.95;
  font-size: 1rem;
}

.container {
  max-width: 1100px;
  margin: 0 auto;
  padding: 28px 16px 48px;
}

.toolbar {
  background: rgba(255, 255, 255, 0.92);
  border-radius: 22px;
  padding: 18px;
  box-shadow: 0 12px 28px rgba(37, 99, 235, 0.12);
  margin-bottom: 24px;
  display: grid;
  gap: 14px;
  border: 1px solid #bfdbfe;
  backdrop-filter: blur(8px);
}

.search-box input,
.filter-box select {
  width: 100%;
  padding: 14px 16px;
  border: 1px solid #bfdbfe;
  border-radius: 14px;
  font-size: 1rem;
  outline: none;
  background: #ffffff;
  color: #1e3a5f;
}

.search-box input::placeholder {
  color: #93c5fd;
}

.search-box input:focus,
.filter-box select:focus {
  border-color: #2563eb;
  box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.16);
}

.stats {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  font-size: 0.95rem;
}

.badge {
  background: linear-gradient(135deg, #dbeafe, #fce7f3);
  color: #1e3a8a;
  padding: 6px 12px;
  border-radius: 999px;
  font-weight: 700;
  border: 1px solid #bfdbfe;
}

.section-title {
  margin: 30px 0 14px;
  font-size: 1.35rem;
  color: #1e3a8a;
  border-left: 6px solid #ef4444;
  padding-left: 12px;
  position: relative;
}

.section-title::after {
  content: " 🗻";
  font-size: 1.1rem;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 16px;
}

.card {
  background:
    radial-gradient(circle at top right, rgba(252, 231, 243, 0.9), transparent 30%),
    linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(239, 246, 255, 0.96));
  border-radius: 22px;
  padding: 20px;
  box-shadow: 0 10px 22px rgba(30, 58, 138, 0.13);
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s, border 0.2s,
    background 0.2s;
  border: 2px solid transparent;
  position: relative;
  overflow: hidden;
}

/* 卡片右上角迷你太陽 */
.card::before {
  content: "";
  position: absolute;
  width: 76px;
  height: 76px;
  right: -26px;
  top: -26px;
  background: radial-gradient(circle, #fb7185 0 32%, #fdba74 33% 54%, transparent 56%);
  opacity: 0.45;
  pointer-events: none;
}

/* 卡片底部富士山淡影 */
.card::after {
  content: "";
  position: absolute;
  left: 18px;
  bottom: -28px;
  width: 120px;
  height: 70px;
  background: linear-gradient(180deg, #ffffff 0 24%, #bfdbfe 25% 100%);
  clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
  opacity: 0.55;
  pointer-events: none;
}

.card:hover {
  transform: translateY(-4px);
  box-shadow: 0 16px 32px rgba(30, 58, 138, 0.2);
  border-color: #93c5fd;
}

.card.learned {
  border-color: #ef4444;
  background:
    radial-gradient(circle at top right, rgba(254, 202, 202, 0.9), transparent 32%),
    linear-gradient(180deg, #fff7ed, #eff6ff);
}

.card.learned::after {
  content: "";
  position: absolute;
  left: 18px;
  bottom: -28px;
  width: 120px;
  height: 70px;
  background: linear-gradient(180deg, #ffffff 0 24%, #93c5fd 25% 100%);
  clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
  opacity: 0.55;
  pointer-events: none;
}

.card.learned .learned-label {
  display: inline-block;
}

.jp {
  font-size: 1.65rem;
  font-weight: 700;
  color: #172554;
  margin-bottom: 8px;
  font-family: "Noto Sans JP", sans-serif;
  position: relative;
  z-index: 1;
}

.romaji {
  color: #2563eb;
  font-weight: 700;
  margin-bottom: 10px;
  font-size: 1rem;
  position: relative;
  z-index: 1;
}

.meaning {
  font-size: 1.08rem;
  color: #334155;
  margin-bottom: 10px;
  position: relative;
  z-index: 1;
}

.usage {
  font-size: 0.9rem;
  color: #1e3a8a;
  background: #dbeafe;
  display: inline-block;
  padding: 5px 10px;
  border-radius: 999px;
  border: 1px solid #bfdbfe;
  position: relative;
  z-index: 1;
}

.play {
  margin-top: 14px;
  border: none;
  background: linear-gradient(135deg, #1e3a8a, #2563eb 55%, #ef4444);
  color: white;
  padding: 9px 12px;
  border-radius: 12px;
  font-weight: 700;
  cursor: pointer;
  font-size: 0.9rem;
  box-shadow: 0 7px 14px rgba(37, 99, 235, 0.25);
  position: relative;
  z-index: 1;
}

.play:hover {
  background: linear-gradient(135deg, #172554, #1d4ed8 55%, #dc2626);
}

.note {
  background:
    linear-gradient(135deg, rgba(255, 255, 255, 0.92), rgba(219, 234, 254, 0.92));
  border: 1px solid #bfdbfe;
  color: #1e3a5f;
  padding: 16px;
  border-radius: 18px;
  margin-bottom: 22px;
  box-shadow: 0 8px 18px rgba(30, 58, 138, 0.1);
}

.hidden {
  display: none;
}

footer {
  text-align: center;
  color: #1e3a8a;
  padding: 30px 16px;
  font-size: 0.9rem;
}

@media (min-width: 720px) {
  .toolbar {
    grid-template-columns: 1fr 220px;
    align-items: center;
  }

  .stats {
    grid-column: 1 / -1;
  }
}

@media (max-width: 480px) {
  header {
    padding-bottom: 52px;
  }

  header h1 {
    font-size: 1.55rem;
  }

  header::before {
    width: 280px;
    height: 140px;
    bottom: -38px;
  }

  header::after {
    bottom: 49px;
  }

  .jp {
    font-size: 1.45rem;
  }
}
    
  .learned-label {
    display: none;
    position: absolute;
    top: 12px;
    right: 12px;
    background: linear-gradient(135deg, #ef4444, #fb7185);
    color: white;
    font-size: 0.75rem;
    padding: 4px 8px;
    border-radius: 999px;
    font-weight: bold;
    z-index: 3;
    box-shadow: 0 4px 10px rgba(239, 68, 68, 0.25);
  }
    
  </style>
</head>
<body>
  <header>
    <h1>日文生活常用短句學習</h1>
    <p>日文句子・羅馬音讀音・中文意思・生活場景</p>
  </header>

  <main class="container">
    <div class="note">
      使用方法：可以搜尋日文 / 羅馬音 / 中文。點擊卡片可標記「已學會」。
      按「播放讀音」會使用瀏覽器語音功能朗讀日文。
    </div>

    <div class="toolbar">
      <div class="search-box">
        <input id="searchInput" type="text" placeholder="搜尋：例如 ありがとう / arigatou / 謝謝" />
      </div>

      <div class="filter-box">
        <select id="categoryFilter">
          <option value="all">全部分類</option>
          <option value="打招呼">打招呼</option>
          <option value="感謝與道歉">感謝與道歉</option>
          <option value="日常回應">日常回應</option>
          <option value="問問題">問問題</option>
          <option value="餐廳">餐廳</option>
          <option value="購物">購物</option>
          <option value="交通">交通</option>
          <option value="旅行求助">旅行求助</option>
          <option value="朋友聊天">朋友聊天</option>
          <option value="萬用句">萬用句</option>
        </select>
      </div>

      <div class="stats">
        <span class="badge" id="totalCount">總共 0 句</span>
        <span class="badge" id="visibleCount">目前顯示 0 句</span>
        <span class="badge" id="learnedCount">已學會 0 句</span>
      </div>
    </div>

    <div id="phraseContainer"></div>
  </main>

  <footer>
    Made for Japanese daily phrase learning
  </footer>

  <script>
    const phrases = [
      {
        category: "打招呼",
        jp: "おはよう。",
        romaji: "ohayou",
        meaning: "早晨 / 早安",
        usage: "朋友、家人用"
      },
      {
        category: "打招呼",

      },
      {
        category: "打招呼",

        romaji: "konnichiwa",

      },
      {
        category: "打招呼",

        romaji: "konbanwa",

      },
      {
        category: "打招呼",
        jp: "じゃあね。",

      {

      },
      {
        category: "感謝與道歉",
        jp: "ありがとうございます。",
        romaji: "arigatou gozaimasu",
        meaning: "謝謝您",
        usage: "禮貌說法"
      },
      {
        category: "感謝與道歉",
        jp: "どういたしまして。",
        romaji: "dou itashimashite",
        meaning: "不客氣",

      {

      {

      {

      {
        category: "朋友聊天",
        jp: "眠い。",
        romaji: "nemui",
        meaning: "很想睡",
        usage: "朋友聊天"
      },
      {
        category: "朋友聊天",
        jp: "疲れた。",
        romaji: "tsukareta",
        meaning: "累了",
        usage: "朋友聊天"
      },
      {
        category: "朋友聊天",
        jp: "行こう。",
        romaji: "ikou",
        meaning: "走吧",
        usage: "朋友聊天"
      },

      {
        category: "萬用句",
        jp: "お願いします。",
        romaji: "onegaishimasu",
        meaning: "麻煩你 / 拜託了 / 請",
        usage: "萬用禮貌句"
      },
      {
        category: "萬用句",
        jp: "ちょっと待ってください。",
        romaji: "chotto matte kudasai",
        meaning: "請等一下",
        usage: "日常"
      },
      {
        category: "萬用句",
        jp: "もう一回お願いします。",
        romaji: "mou ikkai onegaishimasu",
        meaning: "請再一次",
        usage: "聽不清楚時"
      },
      {
        category: "萬用句",
        jp: "わかりません。",
        romaji: "wakarimasen",
        meaning: "我不明白",
        usage: "日常"
      },
      {
        category: "萬用句",
        jp: "忘れました。",
        romaji: "wasuremashita",
        meaning: "我忘記了",
        usage: "日常"
      }
    ];

    const phraseContainer = document.getElementById("phraseContainer");
    const searchInput = document.getElementById("searchInput");
    const categoryFilter = document.getElementById("categoryFilter");
    const totalCount = document.getElementById("totalCount");
    const visibleCount = document.getElementById("visibleCount");
    const learnedCount = document.getElementById("learnedCount");

    const learnedSet = new Set();

    function speakJapanese(text) {
      if (!("speechSynthesis" in window)) {
        showCustomMessage("你的瀏覽器不支援語音朗讀功能。");
        return;
      }

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "ja-JP";
      utterance.rate = 0.85;
      utterance.pitch = 1;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(utterance);
    }

    function renderPhrases() {
      const keyword = searchInput.value.trim().toLowerCase();
      const selectedCategory = categoryFilter.value;

      const filtered = phrases.filter((phrase) => {
        const matchesCategory =
          selectedCategory === "all" || phrase.category === selectedCategory;

        const searchText = [
          phrase.jp,
          phrase.romaji,
          phrase.meaning,
          phrase.usage,
          phrase.category
        ]
          .join(" ")
          .toLowerCase();

        return matchesCategory && searchText.includes(keyword);
      });

      phraseContainer.innerHTML = "";

      const grouped = {};
      filtered.forEach((phrase, index) => {
        if (!grouped[phrase.category]) {
          grouped[phrase.category] = [];
        }
        grouped[phrase.category].push({
          ...phrase,
          originalIndex: phrases.indexOf(phrase)
        });
      });

      Object.keys(grouped).forEach((category) => {
        const title = document.createElement("h2");
        title.className = "section-title";
        title.textContent = category;
        phraseContainer.appendChild(title);

        const grid = document.createElement("div");
        grid.className = "grid";

        grouped[category].forEach((phrase) => {
          const card = document.createElement("div");
          card.className = "card";
          if (learnedSet.has(phrase.originalIndex)) {
            card.classList.add("learned");
          }

          card.innerHTML = `
          <span class="learned-label">已登頂</span>
          <div class="jp">${phrase.jp}</div>
          <div class="romaji">讀音：${phrase.romaji}</div>
          <div class="meaning">${phrase.meaning}</div>
          <div class="usage">${phrase.usage}</div>
          <br />
          <button class="play" type="button">播放讀音</button>
        `;

          card.addEventListener("click", function () {
            if (learnedSet.has(phrase.originalIndex)) {
              learnedSet.delete(phrase.originalIndex);
              card.classList.remove("learned");
            } else {
              learnedSet.add(phrase.originalIndex);
              card.classList.add("learned");
            }
            updateCounts(filtered.length);
          });

          const playButton = card.querySelector(".play");
          playButton.addEventListener("click", function (event) {
            event.stopPropagation();
            speakJapanese(phrase.jp);
          });

          grid.appendChild(card);
        });

        phraseContainer.appendChild(grid);
      });

      if (filtered.length === 0) {
        phraseContainer.innerHTML = `
          <div class="note">
            找不到相關短句。可以試試搜尋「謝謝」、「廁所」、「arigatou」、「toire」。
          </div>
        `;
      }

      updateCounts(filtered.length);
    }

    function updateCounts(currentVisible) {
      totalCount.textContent = `總共 ${phrases.length} 句`;
      visibleCount.textContent = `目前顯示 ${currentVisible} 句`;
      learnedCount.textContent = `已學會 ${learnedSet.size} 句`;
    }

    function showCustomMessage(message) {
      const box = document.createElement("div");
      box.style.position = "fixed";
      box.style.left = "50%";
      box.style.bottom = "24px";
      box.style.transform = "translateX(-50%)";
      box.style.background = "#111827";
      box.style.color = "white";
      box.style.padding = "12px 18px";
      box.style.borderRadius = "999px";
      box.style.zIndex = "9999";
      box.style.boxShadow = "0 10px 25px rgba(0,0,0,0.2)";
      box.textContent = message;

      document.body.appendChild(box);

      setTimeout(() => {
        box.remove();
      }, 2500);
    }

    searchInput.addEventListener("input", renderPhrases);
    categoryFilter.addEventListener("change", renderPhrases);

    renderPhrases();
  </script>
</body>
</html>
