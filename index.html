<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>日文生活常用短句學習</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC",
        "Noto Sans JP", Arial, sans-serif;
      background: linear-gradient(135deg, #fdf2f8, #eff6ff);
      color: #1f2937;
      line-height: 1.6;
    }

    header {
      background: linear-gradient(135deg, #ef4444, #ec4899);
      color: white;
      padding: 32px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 2rem;
      letter-spacing: 1px;
    }

    header p {
      margin: 10px 0 0;
      opacity: 0.95;
      font-size: 1rem;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }

    .toolbar {
      background: white;
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      margin-bottom: 24px;
      display: grid;
      gap: 14px;
    }

    .search-box input,
    .filter-box select {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid #d1d5db;
      border-radius: 14px;
      font-size: 1rem;
      outline: none;
      background: #fff;
    }

    .search-box input:focus,
    .filter-box select:focus {
      border-color: #ec4899;
      box-shadow: 0 0 0 3px rgba(236, 72, 153, 0.15);
    }

    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 0.95rem;
    }

    .badge {
      background: #fce7f3;
      color: #9d174d;
      padding: 6px 12px;
      border-radius: 999px;
      font-weight: 600;
    }

    .section-title {
      margin: 30px 0 14px;
      font-size: 1.35rem;
      color: #be123c;
      border-left: 6px solid #ec4899;
      padding-left: 12px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.08);
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s, border 0.2s;
      border: 2px solid transparent;
      position: relative;
      overflow: hidden;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 14px 28px rgba(0, 0, 0, 0.12);
    }

    .card.learned {
      border-color: #22c55e;
      background: #f0fdf4;
    }

    .card.learned::after {
      content: "已學會";
      position: absolute;
      top: 12px;
      right: 12px;
      background: #22c55e;
      color: white;
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 999px;
      font-weight: bold;
    }

    .jp {
      font-size: 1.65rem;
      font-weight: 700;
      color: #111827;
      margin-bottom: 8px;
      font-family: "Noto Sans JP", sans-serif;
    }

    .romaji {
      color: #2563eb;
      font-weight: 700;
      margin-bottom: 10px;
      font-size: 1rem;
    }

    .meaning {
      font-size: 1.08rem;
      color: #374151;
      margin-bottom: 10px;
    }

    .usage {
      font-size: 0.9rem;
      color: #6b7280;
      background: #f3f4f6;
      display: inline-block;
      padding: 5px 10px;
      border-radius: 999px;
    }

    .play {
      margin-top: 14px;
      border: none;
      background: #ec4899;
      color: white;
      padding: 9px 12px;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .play:hover {
      background: #db2777;
    }

    .note {
      background: #fffbeb;
      border: 1px solid #fde68a;
      color: #92400e;
      padding: 16px;
      border-radius: 16px;
      margin-bottom: 22px;
    }

    .hidden {
      display: none;
    }

    footer {
      text-align: center;
      color: #6b7280;
      padding: 30px 16px;
      font-size: 0.9rem;
    }

    @media (min-width: 720px) {
      .toolbar {
        grid-template-columns: 1fr 220px;
        align-items: center;
      }

      .stats {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 480px) {
      header h1 {
        font-size: 1.6rem;
      }

      .jp {
        font-size: 1.45rem;
      }
    }
  </style>
</head>
<body>

    <p>日文句子・羅馬音讀音・中文意思・生活場景</p>
  </header>

  <main class="container">

      按「播放讀音」會使用瀏覽器語音功能朗讀日文。
    </div>

    <div class="toolbar">

      </div>

      <div class="filter-box">

          <option value="感謝與道歉">感謝與道歉</option>

        </select>
      </div>

      <div class="stats">
        <span class="badge" id="totalCount">總共 0 句</span>
        <span class="badge" id="visibleCount">目前顯示 0 句</span>
        <span class="badge" id="learnedCount">已學會 0 句</span>

    </div>

    <div id="phraseContainer"></div>
  </main>

  <footer>

    const phraseContainer = document.getElementById("phraseContainer");
    const searchInput = document.getElementById("searchInput");
    const categoryFilter = document.getElementById("categoryFilter");
    const totalCount = document.getElementById("totalCount");
    const visibleCount = document.getElementById("visibleCount");
    const learnedCount = document.getElementById("learnedCount");

    const learnedSet = new Set();

    function speakJapanese(text) {
      if (!("speechSynthesis" in window)) {
        showCustomMessage("你的瀏覽器不支援語音朗讀功能。");
        return;
      }

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "ja-JP";
      utterance.rate = 0.85;
      utterance.pitch = 1;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(utterance);
    }

    function renderPhrases() {
      const keyword = searchInput.value.trim().toLowerCase();
      const selectedCategory = categoryFilter.value;

      const filtered = phrases.filter((phrase) => {
        const matchesCategory =
          selectedCategory === "all" || phrase.category === selectedCategory;

        const searchText = [
          phrase.jp,
          phrase.romaji,
          phrase.meaning,
          phrase.usage,
          phrase.category
        ]
          .join(" ")
          .toLowerCase();

        return matchesCategory && searchText.includes(keyword);
      });

      phraseContainer.innerHTML = "";

      const grouped = {};
      filtered.forEach((phrase, index) => {
        if (!grouped[phrase.category]) {
          grouped[phrase.category] = [];
        }
        grouped[phrase.category].push({
          ...phrase,
          originalIndex: phrases.indexOf(phrase)
        });
      });

      Object.keys(grouped).forEach((category) => {
        const title = document.createElement("h2");
        title.className = "section-title";
        title.textContent = category;
        phraseContainer.appendChild(title);

        const grid = document.createElement("div");
        grid.className = "grid";

        grouped[category].forEach((phrase) => {
          const card = document.createElement("div");
          card.className = "card";
          if (learnedSet.has(phrase.originalIndex)) {
            card.classList.add("learned");
          }

          card.innerHTML = `
            <div class="jp">${phrase.jp}</div>
            <div class="romaji">讀音：${phrase.romaji}</div>
            <div class="meaning">${phrase.meaning}</div>
            <div class="usage">${phrase.usage}</div>
            <br />
            <button class="play" type="button">播放讀音</button>
          `;

          card.addEventListener("click", function () {
            if (learnedSet.has(phrase.originalIndex)) {
              learnedSet.delete(phrase.originalIndex);
              card.classList.remove("learned");
            } else {
              learnedSet.add(phrase.originalIndex);
              card.classList.add("learned");
            }
            updateCounts(filtered.length);
          });

          const playButton = card.querySelector(".play");
          playButton.addEventListener("click", function (event) {
            event.stopPropagation();
            speakJapanese(phrase.jp);
          });

          grid.appendChild(card);
        });

        phraseContainer.appendChild(grid);
      });

      if (filtered.length === 0) {
        phraseContainer.innerHTML = `
          <div class="note">
            找不到相關短句。可以試試搜尋「謝謝」、「廁所」、「arigatou」、「toire」。
          </div>
        `;
      }

      updateCounts(filtered.length);
    }

    function updateCounts(currentVisible) {
      totalCount.textContent = `總共 ${phrases.length} 句`;
      visibleCount.textContent = `目前顯示 ${currentVisible} 句`;
      learnedCount.textContent = `已學會 ${learnedSet.size} 句`;
    }

    function showCustomMessage(message) {
      const box = document.createElement("div");
      box.style.position = "fixed";
      box.style.left = "50%";
      box.style.bottom = "24px";
      box.style.transform = "translateX(-50%)";
      box.style.background = "#111827";
      box.style.color = "white";
      box.style.padding = "12px 18px";
      box.style.borderRadius = "999px";
      box.style.zIndex = "9999";
      box.style.boxShadow = "0 10px 25px rgba(0,0,0,0.2)";
      box.textContent = message;

      document.body.appendChild(box);

      setTimeout(() => {
        box.remove();
      }, 2500);
    }

    searchInput.addEventListener("input", renderPhrases);
    categoryFilter.addEventListener("change", renderPhrases);

    renderPhrases();
  </script>
</body>
</html>
