<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>日本語日常生活生字表 100｜可發音版</title>
  <style>
    :root {
      --bg: #f7f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #dc2626;
      --primary-dark: #991b1b;
      --border: #e5e7eb;
      --soft: #fee2e2;
      --soft-2: #fff7ed;
      --thead: #111827;
      --green: #059669;
      --blue: #2563eb;
      --shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC",
        "Noto Sans JP", "Helvetica Neue", Arial, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(220, 38, 38, 0.12), transparent 28%),
        radial-gradient(circle at bottom right, rgba(37, 99, 235, 0.08), transparent 32%),
        var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    header {
      padding: 40px 18px 24px;
      text-align: center;
    }

    .title-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--soft);
      color: var(--primary-dark);
      border: 1px solid #fecaca;
      padding: 8px 14px;
      border-radius: 999px;
      font-weight: 700;
      margin-bottom: 14px;
      font-size: 14px;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 5vw, 52px);
      letter-spacing: 0.02em;
      color: #111827;
    }

    .subtitle {
      margin: 12px auto 0;
      max-width: 850px;
      color: var(--muted);
      font-size: 16px;
    }

    main {
      width: min(1280px, calc(100% - 28px));
      margin: 0 auto 50px;
    }

    .panel {
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      border-radius: 22px;
      padding: 18px;
      margin-bottom: 20px;
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1fr 180px 180px;
      gap: 12px;
      align-items: center;
    }

    input,
    select,
    button {
      font: inherit;
    }

    .search {
      width: 100%;
      padding: 13px 15px;
      border: 1px solid var(--border);
      border-radius: 14px;
      outline: none;
      background: #fff;
      color: var(--text);
    }

    .search:focus,
    select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(220, 38, 38, 0.12);
    }

    select {
      width: 100%;
      padding: 13px 15px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #fff;
      color: var(--text);
      outline: none;
    }

    .stats {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 14px;
      color: var(--muted);
      font-size: 14px;
    }

    .chip {
      background: #f3f4f6;
      border: 1px solid var(--border);
      padding: 6px 10px;
      border-radius: 999px;
    }

    .quick-buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .main-btn {
      border: 0;
      border-radius: 999px;
      padding: 9px 14px;
      cursor: pointer;
      background: #111827;
      color: white;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .main-btn:hover {
      transform: translateY(-1px);
      opacity: 0.92;
    }

    .main-btn.secondary {
      background: #f3f4f6;
      color: #111827;
      border: 1px solid var(--border);
    }

    .sound-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-left: 8px;
      width: 32px;
      height: 32px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--primary-dark);
      cursor: pointer;
      font-size: 16px;
      padding: 0;
      vertical-align: middle;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .sound-btn:hover {
      background: var(--soft);
      transform: translateY(-1px);
    }

    .sound-btn:active {
      transform: scale(0.94);
    }

    .table-wrap {
      overflow-x: auto;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--card);
      box-shadow: var(--shadow);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1180px;
    }

    thead {
      background: var(--thead);
      color: #fff;
    }

    th {
      text-align: left;
      padding: 13px 12px;
      font-size: 13px;
      white-space: nowrap;
      position: sticky;
      top: 0;
      z-index: 1;
    }

    td {
      border-top: 1px solid var(--border);
      padding: 12px;
      vertical-align: top;
      font-size: 14px;
    }

    tbody tr {
      transition: background 0.15s ease;
    }

    tbody tr:hover {
      background: #fff7ed;
    }

    .num {
      color: var(--muted);
      font-weight: 700;
      width: 52px;
    }

    .kana {
      font-size: 20px;
      font-weight: 800;
      color: var(--primary-dark);
      white-space: nowrap;
    }

    .kanji {
      font-size: 18px;
      font-weight: 800;
      white-space: nowrap;
    }

    .romaji {
      color: var(--blue);
      font-weight: 600;
      white-space: nowrap;
    }

    .meaning {
      font-weight: 700;
    }

    .english {
      color: var(--muted);
    }

    details {
      background: #f9fafb;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 9px 11px;
      min-width: 340px;
    }

    summary {
      cursor: pointer;
      font-weight: 800;
      color: #111827;
    }

    .sentence-box {
      margin-top: 10px;
      display: grid;
      gap: 8px;
    }

    .jp-sentence {
      font-size: 17px;
      font-weight: 800;
      color: #111827;
    }

    .grammar {
      border-left: 4px solid var(--primary);
      background: #fff;
      padding: 8px 10px;
      border-radius: 8px;
      color: #374151;
    }

    mark {
      background: #fde68a;
      color: inherit;
      padding: 0 2px;
      border-radius: 4px;
    }

    .cards {
      display: none;
      gap: 14px;
    }

    .vocab-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: var(--shadow);
      padding: 16px;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
      margin-bottom: 12px;
    }

    .card-number {
      background: var(--soft);
      color: var(--primary-dark);
      border-radius: 999px;
      padding: 4px 10px;
      font-weight: 800;
      font-size: 13px;
      white-space: nowrap;
    }

    .card-kana {
      font-size: 28px;
      font-weight: 900;
      color: var(--primary-dark);
    }

    .card-kanji {
      font-size: 22px;
      font-weight: 900;
    }

    .card-grid {
      display: grid;
      gap: 7px;
      font-size: 15px;
    }

    .label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .mobile-sentence {
      background: #f9fafb;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      margin-top: 12px;
    }

    .no-results {
      display: none;
      text-align: center;
      padding: 30px;
      color: var(--muted);
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
    }

    .notice {
      margin-top: 12px;
      color: var(--muted);
      font-size: 13px;
    }

    footer {
      text-align: center;
      color: var(--muted);
      padding: 20px;
      font-size: 14px;
    }

    @media (max-width: 900px) {
      .toolbar {
        grid-template-columns: 1fr;
      }

      .table-wrap {
        display: none;
      }

      .cards {
        display: grid;
      }

      main {
        width: min(100% - 20px, 760px);
      }

      header {
        padding-top: 28px;
      }
    }

    @media print {
      body {
        background: #fff;
      }

      .panel,
      .quick-buttons,
      footer,
      .sound-btn {
        display: none;
      }

      main {
        width: 100%;
        margin: 0;
      }

      .table-wrap {
        display: block;
        box-shadow: none;
        border: 0;
      }

      table {
        min-width: 100%;
        font-size: 11px;
      }

      th,
      td {
        padding: 6px;
      }

      details {
        border: 0;
        padding: 0;
        background: transparent;
      }

      details[open] summary {
        display: none;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="title-badge">🇯🇵 Japanese Daily Vocabulary with Voice</div>
    <h1>日本語日常生活生字表 100</h1>
    <p class="subtitle">
      包含假名、羅馬拼音、漢字、中文、英文、例句與語法解釋。按 🔊 可以聽單字或例句發音。
    </p>
  </header>

  <main>
    <section class="panel">
      <div class="toolbar">
        <input
          id="searchInput"
          class="search"
          type="search"
          placeholder="搜尋：例如 水、mizu、drink、食べます、を..."
        />

        <select id="categorySelect" aria-label="分類">
          <option value="all">全部分類</option>
          <option value="time">時間</option>
          <option value="place">地點</option>
          <option value="food">食物飲品</option>
          <option value="object">物品</option>
          <option value="transport">交通</option>
          <option value="people">人物</option>
          <option value="work">學習工作</option>
          <option value="weather">天氣</option>
          <option value="adjective">形容詞</option>
          <option value="verb">動詞</option>
        </select>

        <select id="daySelect" aria-label="每日進度">
          <option value="all">全部 100 個</option>
          <option value="1">Day 1：1-10</option>
          <option value="2">Day 2：11-20</option>
          <option value="3">Day 3：21-30</option>
          <option value="4">Day 4：31-40</option>
          <option value="5">Day 5：41-50</option>
          <option value="6">Day 6：51-60</option>
          <option value="7">Day 7：61-70</option>
          <option value="8">Day 8：71-80</option>
          <option value="9">Day 9：81-90</option>
          <option value="10">Day 10：91-100</option>
        </select>
      </div>

      <div class="stats">
        <span class="chip">目前顯示：<strong id="count">100</strong> 個</span>
        <span class="chip">建議：每天背 10 個</span>
        <span class="chip">按 🔊 聽發音</span>
      </div>

      <div class="quick-buttons">
        <button id="expandAll" class="main-btn">展開所有例句</button>
        <button id="collapseAll" class="main-btn secondary">收合所有例句</button>
        <button id="printBtn" class="main-btn secondary">列印 / 存成 PDF</button>
      </div>

      <p class="notice">
        提示：如果第一次按 🔊 沒有聲音，請再按一次。部分瀏覽器需要使用者互動後才會載入語音。
      </p>
    </section>

    <section class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>假名</th>
            <th>Romaji</th>
            <th>漢字</th>
            <th>中文</th>
            <th>English</th>
            <th>例句與語法</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </section>

    <section id="cards" class="cards"></section>

    <section id="noResults" class="no-results">
      找不到符合條件的單字。請試試其他關鍵字或分類。
    </section>
  </main>

  <footer>
    Made for Japanese learners｜日本語日常単語 100
  </footer>

  <script>
    const vocab = [
      {id:1,cat:"time",kana:"あさ",romaji:"asa",kanji:"朝",zh:"早上",en:"morning",sentence:"朝ごはんを食べます。",sRomaji:"Asa-gohan o tabemasu.",sZh:"我吃早餐。",sEn:"I eat breakfast.",grammar:"「を」標示受詞；「食べます」是禮貌形。"},
      {id:2,cat:"time",kana:"ひる",romaji:"hiru",kanji:"昼",zh:"中午",en:"noon/daytime",sentence:"昼に友達と会います。",sRomaji:"Hiru ni tomodachi to aimasu.",sZh:"我中午和朋友見面。",sEn:"I meet my friend at noon.",grammar:"「に」表時間；「と」表「和」。"},
      {id:3,cat:"time",kana:"よる",romaji:"yoru",kanji:"夜",zh:"晚上",en:"night",sentence:"夜は静かです。",sRomaji:"Yoru wa shizuka desu.",sZh:"晚上很安靜。",sEn:"The night is quiet.",grammar:"「は」標示主題；「です」是判斷句禮貌形。"},
      {id:4,cat:"time",kana:"きょう",romaji:"kyou",kanji:"今日",zh:"今天",en:"today",sentence:"今日は暑いです。",sRomaji:"Kyou wa atsui desu.",sZh:"今天很熱。",sEn:"Today is hot.",grammar:"い形容詞「暑い」直接接「です」。"},
      {id:5,cat:"time",kana:"あした",romaji:"ashita",kanji:"明日",zh:"明天",en:"tomorrow",sentence:"明日、学校へ行きます。",sRomaji:"Ashita, gakkou e ikimasu.",sZh:"明天我去學校。",sEn:"I will go to school tomorrow.",grammar:"「へ」表方向；「行きます」是「去」的禮貌形。"},
      {id:6,cat:"time",kana:"きのう",romaji:"kinou",kanji:"昨日",zh:"昨天",en:"yesterday",sentence:"昨日、映画を見ました。",sRomaji:"Kinou, eiga o mimashita.",sZh:"昨天我看了電影。",sEn:"I watched a movie yesterday.",grammar:"「見ました」是「看」的過去禮貌形。"},
      {id:7,cat:"place",kana:"いえ",romaji:"ie",kanji:"家",zh:"家",en:"house/home",sentence:"家に帰ります。",sRomaji:"Ie ni kaerimasu.",sZh:"我回家。",sEn:"I go home.",grammar:"「に」表目的地；「帰ります」是回去。"},
      {id:8,cat:"place",kana:"へや",romaji:"heya",kanji:"部屋",zh:"房間",en:"room",sentence:"部屋を掃除します。",sRomaji:"Heya o souji shimasu.",sZh:"我打掃房間。",sEn:"I clean the room.",grammar:"「名詞 + を + します」表做某事。"},
      {id:9,cat:"place",kana:"がっこう",romaji:"gakkou",kanji:"学校",zh:"學校",en:"school",sentence:"学校で勉強します。",sRomaji:"Gakkou de benkyou shimasu.",sZh:"我在學校學習。",sEn:"I study at school.",grammar:"「で」表動作發生地點。"},
      {id:10,cat:"place",kana:"かいしゃ",romaji:"kaisha",kanji:"会社",zh:"公司",en:"company",sentence:"会社へ行きます。",sRomaji:"Kaisha e ikimasu.",sZh:"我去公司。",sEn:"I go to the company.",grammar:"「へ」表移動方向。"},

      {id:11,cat:"place",kana:"えき",romaji:"eki",kanji:"駅",zh:"車站",en:"station",sentence:"駅で友達を待ちます。",sRomaji:"Eki de tomodachi o machimasu.",sZh:"我在車站等朋友。",sEn:"I wait for my friend at the station.",grammar:"「で」表地點；「を待つ」是等待某人。"},
      {id:12,cat:"place",kana:"みせ",romaji:"mise",kanji:"店",zh:"店舖",en:"shop/store",sentence:"店でパンを買います。",sRomaji:"Mise de pan o kaimasu.",sZh:"我在店裡買麵包。",sEn:"I buy bread at the shop.",grammar:"「で」表購買地點；「を」標示受詞。"},
      {id:13,cat:"place",kana:"びょういん",romaji:"byouin",kanji:"病院",zh:"醫院",en:"hospital",sentence:"病院へ行きます。",sRomaji:"Byouin e ikimasu.",sZh:"我去醫院。",sEn:"I go to the hospital.",grammar:"「へ行きます」表去某地。"},
      {id:14,cat:"food",kana:"くすり",romaji:"kusuri",kanji:"薬",zh:"藥",en:"medicine",sentence:"薬を飲みます。",sRomaji:"Kusuri o nomimasu.",sZh:"我吃藥。",sEn:"I take medicine.",grammar:"日文「吃藥」用「薬を飲む」。"},
      {id:15,cat:"food",kana:"みず",romaji:"mizu",kanji:"水",zh:"水",en:"water",sentence:"水を飲みます。",sRomaji:"Mizu o nomimasu.",sZh:"我喝水。",sEn:"I drink water.",grammar:"「飲みます」是喝。"},
      {id:16,cat:"food",kana:"おちゃ",romaji:"ocha",kanji:"お茶",zh:"茶",en:"tea",sentence:"お茶をください。",sRomaji:"Ocha o kudasai.",sZh:"請給我茶。",sEn:"Please give me tea.",grammar:"「ください」表請求。"},
      {id:17,cat:"food",kana:"ごはん",romaji:"gohan",kanji:"ご飯",zh:"飯/餐",en:"rice/meal",sentence:"ご飯を食べます。",sRomaji:"Gohan o tabemasu.",sZh:"我吃飯。",sEn:"I eat rice/a meal.",grammar:"「ご飯」可指白飯或一餐。"},
      {id:18,cat:"food",kana:"パン",romaji:"pan",kanji:"—",zh:"麵包",en:"bread",sentence:"パンを買いました。",sRomaji:"Pan o kaimashita.",sZh:"我買了麵包。",sEn:"I bought bread.",grammar:"「買いました」是買的過去式。"},
      {id:19,cat:"food",kana:"にく",romaji:"niku",kanji:"肉",zh:"肉",en:"meat",sentence:"肉が好きです。",sRomaji:"Niku ga suki desu.",sZh:"我喜歡肉。",sEn:"I like meat.",grammar:"「〜が好きです」表喜歡。"},
      {id:20,cat:"food",kana:"さかな",romaji:"sakana",kanji:"魚",zh:"魚",en:"fish",sentence:"魚を食べません。",sRomaji:"Sakana o tabemasen.",sZh:"我不吃魚。",sEn:"I do not eat fish.",grammar:"「ません」是否定禮貌形。"},

      {id:21,cat:"food",kana:"やさい",romaji:"yasai",kanji:"野菜",zh:"蔬菜",en:"vegetables",sentence:"野菜は体にいいです。",sRomaji:"Yasai wa karada ni ii desu.",sZh:"蔬菜對身體好。",sEn:"Vegetables are good for the body.",grammar:"「〜にいい」表對某事物好。"},
      {id:22,cat:"food",kana:"くだもの",romaji:"kudamono",kanji:"果物",zh:"水果",en:"fruit",sentence:"果物を毎日食べます。",sRomaji:"Kudamono o mainichi tabemasu.",sZh:"我每天吃水果。",sEn:"I eat fruit every day.",grammar:"「毎日」是時間副詞。"},
      {id:23,cat:"food",kana:"たまご",romaji:"tamago",kanji:"卵",zh:"蛋",en:"egg",sentence:"卵を二つ買います。",sRomaji:"Tamago o futatsu kaimasu.",sZh:"我買兩隻蛋。",sEn:"I buy two eggs.",grammar:"「二つ」是一般物品數量詞。"},
      {id:24,cat:"food",kana:"ぎゅうにゅう",romaji:"gyuunyuu",kanji:"牛乳",zh:"牛奶",en:"milk",sentence:"牛乳を飲みます。",sRomaji:"Gyuunyuu o nomimasu.",sZh:"我喝牛奶。",sEn:"I drink milk.",grammar:"「を飲みます」表喝某物。"},
      {id:25,cat:"food",kana:"コーヒー",romaji:"koohii",kanji:"—",zh:"咖啡",en:"coffee",sentence:"コーヒーを一杯ください。",sRomaji:"Koohii o ippai kudasai.",sZh:"請給我一杯咖啡。",sEn:"One coffee, please.",grammar:"「一杯」是飲品一杯。"},
      {id:26,cat:"object",kana:"ほん",romaji:"hon",kanji:"本",zh:"書",en:"book",sentence:"本を読みます。",sRomaji:"Hon o yomimasu.",sZh:"我看書。",sEn:"I read a book.",grammar:"「読みます」是讀。"},
      {id:27,cat:"object",kana:"えんぴつ",romaji:"enpitsu",kanji:"鉛筆",zh:"鉛筆",en:"pencil",sentence:"鉛筆で書きます。",sRomaji:"Enpitsu de kakimasu.",sZh:"我用鉛筆寫。",sEn:"I write with a pencil.",grammar:"「で」表工具。"},
      {id:28,cat:"object",kana:"かばん",romaji:"kaban",kanji:"鞄",zh:"包包",en:"bag",sentence:"かばんを持っています。",sRomaji:"Kaban o motte imasu.",sZh:"我拿著包包。",sEn:"I am carrying a bag.",grammar:"「〜ています」表持續狀態。"},
      {id:29,cat:"object",kana:"くつ",romaji:"kutsu",kanji:"靴",zh:"鞋",en:"shoes",sentence:"靴を履きます。",sRomaji:"Kutsu o hakimasu.",sZh:"我穿鞋。",sEn:"I put on shoes.",grammar:"穿鞋、褲子用「履く」。"},

    const tableBody = document.getElementById("tableBody");
    const cards = document.getElementById("cards");
    const searchInput = document.getElementById("searchInput");
    const categorySelect = document.getElementById("categorySelect");
    const daySelect = document.getElementById("daySelect");
    const count = document.getElementById("count");
    const noResults = document.getElementById("noResults");

    let japaneseVoice = null;

    function loadVoices() {
      const voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
      japaneseVoice =
        voices.find(voice => voice.lang === "ja-JP") ||
        voices.find(voice => voice.lang && voice.lang.startsWith("ja")) ||
        null;
    }

    if ("speechSynthesis" in window) {
      loadVoices();
      window.speechSynthesis.onvoiceschanged = loadVoices;
    }

    function speakJapanese(text) {
      if (!("speechSynthesis" in window)) {
        alert("你的瀏覽器不支援語音功能。請試試 Chrome、Edge 或 Safari。");
        return;
      }

      loadVoices();

      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "ja-JP";
      utterance.rate = 0.85;
      utterance.pitch = 1;
      utterance.volume = 1;

      if (japaneseVoice) {
        utterance.voice = japaneseVoice;
      }

      window.speechSynthesis.speak(utterance);
    }

        return {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          "\"": "&quot;",
          "'": "&#039;"
        }[match];
      });
    }

    function jsString(str) {
      return String(str)
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'")
        .replace(/\n/g, "\\n")
        .replace(/\r/g, "");
    }

    function highlight(text, keyword) {
      const safe = escapeHTML(text);
      if (!keyword) return safe;

      const escapedKeyword = keyword.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      const regex = new RegExp("(" + escapedKeyword + ")", "gi");
      return safe.replace(regex, "<mark>$1</mark>");
    }

    function itemMatchesSearch(item, keyword) {
      if (!keyword) return true;

      const haystack = [
        item.kana,
        item.romaji,
        item.kanji,
        item.zh,
        item.en,
        item.sentence,
        item.sRomaji,
        item.sZh,
        item.sEn,
        item.grammar
      ].join(" ").toLowerCase();

      return haystack.includes(keyword.toLowerCase());
    }

    function itemMatchesDay(item, day) {
      if (day === "all") return true;

      const d = Number(day);
      const start = (d - 1) * 10 + 1;
      const end = d * 10;

      return item.id >= start && item.id <= end;
    }

    function soundButton(text, title) {
      return `
        <button
          class="sound-btn"
          type="button"
          title="${escapeHTML(title)}"
          aria-label="${escapeHTML(title)}"
          onclick="event.stopPropagation(); speakJapanese('${jsString(text)}')"
        >🔊</button>
      `;
    }

    function render() {
      const keyword = searchInput.value.trim();
      const cat = categorySelect.value;
      const day = daySelect.value;

      const filtered = vocab.filter(item => {
        const catOk = cat === "all" || item.cat === cat;
        const dayOk = itemMatchesDay(item, day);
        const searchOk = itemMatchesSearch(item, keyword);
        return catOk && dayOk && searchOk;
      });

      count.textContent = filtered.length;
      noResults.style.display = filtered.length === 0 ? "block" : "none";

      tableBody.innerHTML = filtered.map(item => `
        <tr>
          <td class="num">${item.id}</td>
          <td class="kana">
            ${highlight(item.kana, keyword)}
            ${soundButton(item.kana, "播放單字發音")}
          </td>
          <td class="romaji">${highlight(item.romaji, keyword)}</td>
          <td class="kanji">${highlight(item.kanji, keyword)}</td>
          <td class="meaning">${highlight(item.zh, keyword)}</td>
          <td class="english">${highlight(item.en, keyword)}</td>
          <td>
            <details>
              <summary>
                ${highlight(item.sentence, keyword)}
                ${soundButton(item.sentence, "播放例句發音")}
              </summary>
              <div class="sentence-box">
                <div><span class="label">Romaji：</span>${highlight(item.sRomaji, keyword)}</div>
                <div><span class="label">中文：</span>${highlight(item.sZh, keyword)}</div>
                <div><span class="label">English：</span>${highlight(item.sEn, keyword)}</div>
                <div class="grammar"><strong>語法：</strong>${highlight(item.grammar, keyword)}</div>
              </div>
            </details>
          </td>
        </tr>
      `).join("");

      cards.innerHTML = filtered.map(item => `
        <article class="vocab-card">
          <div class="card-top">
            <div>
              <div class="card-kana">
                ${highlight(item.kana, keyword)}
                ${soundButton(item.kana, "播放單字發音")}
              </div>
              <div class="card-kanji">${highlight(item.kanji, keyword)}</div>
            </div>
            <div class="card-number">#${item.id}</div>
          </div>

          <div class="card-grid">
            <div><span class="label">Romaji：</span><span class="romaji">${highlight(item.romaji, keyword)}</span></div>
            <div><span class="label">中文：</span><strong>${highlight(item.zh, keyword)}</strong></div>
            <div><span class="label">English：</span>${highlight(item.en, keyword)}</div>
          </div>

          <div class="mobile-sentence">
            <div class="jp-sentence">
              ${highlight(item.sentence, keyword)}
              ${soundButton(item.sentence, "播放例句發音")}
            </div>
            <div><span class="label">Romaji：</span>${highlight(item.sRomaji, keyword)}</div>
            <div><span class="label">中文：</span>${highlight(item.sZh, keyword)}</div>
            <div><span class="label">English：</span>${highlight(item.sEn, keyword)}</div>
            <div class="grammar"><strong>語法：</strong>${highlight(item.grammar, keyword)}</div>
          </div>
        </article>
      `).join("");
    }

    searchInput.addEventListener("input", render);
    categorySelect.addEventListener("change", render);
    daySelect.addEventListener("change", render);

    document.getElementById("expandAll").addEventListener("click", () => {
      document.querySelectorAll("details").forEach(d => d.open = true);
    });

    document.getElementById("collapseAll").addEventListener("click", () => {
      document.querySelectorAll("details").forEach(d => d.open = false);
    });

    document.getElementById("printBtn").addEventListener("click", () => {
      window.print();
    });

    render();
  </script>
</body>
</html>
